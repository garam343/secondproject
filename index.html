<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 전용 AI 튜터</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 24px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            padding: 12px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #357ABD;
        }
        .result-box {
            background-color: #f9f9f9;
            border-left: 4px solid #4A90E2;
            padding: 16px;
            border-radius: 4px;
            min-height: 80px;
            white-space: pre-wrap;
            font-size: 15px;
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📐 수학 AI 프롬프트 입력창</h2>
    
    <div class="input-group">
        <label for="prompt">수학 문제나 질문을 입력하세요:</label>
        <textarea id="prompt" placeholder="예: 이차방정식 x^2 - 5x + 6 = 0 의 근을 구하고 과정을 설명해줘."></textarea>
        <button onclick="submitPrompt()">수학 AI에게 질문하기</button>
    </div>

    <h3>답변 결과</h3>
    <div id="result" class="result-box">질문을 입력하고 버튼을 누르면 여기에 답변이 표시됩니다.</div>
</div>

<script>
    function submitPrompt() {
        const input = document.getElementById('prompt').value;
        const resultDiv = document.getElementById('result');
        
        if (!input.trim()) {
            alert('질문을 입력해주세요!');
            return;
        }

        resultDiv.innerText = "답변을 작성하는 중입니다...";
        
        // 실제 API 연동 시 이 부분에서 AI API를 호출합니다.
        setTimeout(() => {
            resultDiv.innerText = `[입력한 프롬프트]\n"${input}"\n\n[수학 AI 답변 예시]\n선택하신 문제의 단계별 풀이와 개념 설명이 들어가는 영역입니다.`;
        }, 1000);
    }
</script>

</body>
</html>
